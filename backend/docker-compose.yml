services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness"]
      interval: 5s
      retries: 10

  fake-cv:
    build: ../fake-cv-service
    environment:
      CV_API_KEY: dev-cv-api-key
      CV_WEBHOOK_SECRET: dev-webhook-secret-change-me-in-production
      FAKE_PROCESSING_DELAY_SEC: "5"
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The real CV service (MediaPipe/OpenCV). Same port and env vars as fake-cv on purpose — it's
  # a drop-in replacement for CV_SERVICE_URL, not something to run alongside it. Behind a profile
  # so a plain `docker compose up` doesn't force the MediaPipe/OpenCV build on everyone; opt in
  # with `docker compose --profile real-cv up -d db cv-service`.
  cv-service:
    build: ../cv-service
    profiles: ["real-cv"]
    environment:
      CV_API_KEY: dev-cv-api-key
      CV_WEBHOOK_SECRET: dev-webhook-secret-change-me-in-production
      CV_SERVICE_BASE_URL: http://localhost:9000
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
